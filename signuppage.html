<html lang="en">
<head>

    <title>Sign Up Page</title>
</head>
<body>
    <nav>
 <img src="assets/ChatGPT Image Aug 9, 2025, 02_19_04 PM.png" alt="" class="logo"></img>
        <ul class="navbar">
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="about.html">About us</a></li>
        </ul>
    </nav>
        
    <h1>Sign Up</h1>
    <form action="home.html">
        <div class="form group">
            <label for="username">
                Username:
                <input type="text" id="username" name="username" required>
            </label><br>
            <label for="password">
                Password:
                <input type="text" id="password" name="password" placeholder="at least 8 characters" required>
            </label><br>
            <label for="email">
                Email:
                <input type="text" id="email" name="email" required>
            </label><br>
            <label for="number">
                Phone Number:
                <input type="tel" name="phone number" id="phone number"  placeholder="optional">
            </label><br>
            <button type="submit">Sign Up</button>
    <p>already have an account? <a href="loginpage.html">Login</a></p>
        </div>
    </form><br>

    
</body>
</html>
